<script>
function copySig(id,btn){
  var r=document.createRange();r.selectNode(document.getElementById(id));
  var s=getSelection();s.removeAllRanges();s.addRange(r);
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  s.removeAllRanges();
  var t=btn.textContent;btn.textContent=ok?'Copied':'Select and copy manually';
  setTimeout(function(){btn.textContent=t},1800);
}
</script>
